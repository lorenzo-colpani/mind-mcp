[package]
name = "mind-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "sync"] }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = true
